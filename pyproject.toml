[project]
name = "codex-aura"
version = "0.2.0"
description = "Windows desktop theme workspace for the Codex Dream Skin backend"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codex-aura = "codex_theme_manager.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
